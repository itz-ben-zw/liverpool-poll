<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuickCart | Everyday essentials</title><style>*{box-sizing:border-box}body{margin:0;font:16px Arial,sans-serif;background:#f6f7fb;color:#172033}header{background:#111827;color:white;padding:22px max(5vw,20px);display:flex;justify-content:space-between;align-items:center}header strong{font-size:25px}main{max-width:1100px;margin:35px auto;padding:0 20px}.hero{background:#e8efff;border-radius:18px;padding:34px;margin-bottom:28px}.hero h1{font-size:36px;margin:0 0 10px}.layout{display:grid;grid-template-columns:2fr 1fr;gap:24px}.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:18px}.card,.cart{background:white;border-radius:14px;padding:16px;box-shadow:0 4px 18px #17203310}.card img{width:100%;height:155px;object-fit:cover;border-radius:10px}.card h3{margin:12px 0 5px}.muted{color:#64748b;font-size:14px}.price{font-weight:bold;font-size:19px;margin:12px 0}.btn{border:0;background:#315efb;color:white;padding:11px 14px;border-radius:9px;cursor:pointer}.cart{height:max-content;position:sticky;top:20px}.cart-row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #eee;padding:10px 0;font-size:14px}input{width:100%;padding:11px;border:1px solid #d5d9e2;border-radius:8px;margin:6px 0 10px}button:disabled{opacity:.5}@media(max-width:750px){.layout{grid-template-columns:1fr}.cart{position:static}.hero h1{font-size:28px}}</style></head><body><header><strong>🛒 QuickCart</strong><span>Simple shopping, made easy</span></header><main><section class="hero"><h1>Everyday essentials, one cart.</h1><p>Discover useful products at friendly prices. Add your favourites and check out in seconds.</p></section><div class="layout"><section><h2>Featured products</h2><div id="products" class="products">Loading products…</div></section><aside class="cart"><h2>Your cart (<span id="count">0</span>)</h2><div id="items">Your cart is empty.</div><h3>Total: $<span id="total">0.00</span></h3><h3>Checkout</h3><form id="checkout"><input name="name" placeholder="Full name" required><input name="email" type="email" placeholder="Email address" required><input name="address" placeholder="Delivery address" required><button class="btn" style="width:100%">Place order</button></form><p id="message" class="muted"></p></aside></div></main><script>let cart=[];const money=n=>Number(n).toFixed(2);async function load(){const p=await fetch('/api/products').then(r=>r.json());document.querySelector('#products').innerHTML=p.map(x=>'<article class="card"><img src="'+x.image+'" alt="'+x.name+'"><h3>'+x.name+'</h3><p class="muted">'+x.description+'</p><div class="price">$'+money(x.price)+'</div><button class="btn" onclick="add('+x.id+')">Add to cart</button></article>').join('')}function add(id){const x=cart.find(i=>i.id===id);x?x.quantity++:cart.push({id,quantity:1});render()}function remove(id){cart=cart.filter(i=>i.id!==id);render()}function render(){document.querySelector('#count').textContent=cart.reduce((s,i)=>s+i.quantity,0);document.querySelector('#items').innerHTML=cart.length?cart.map(i=>'<div class="cart-row"><span>Item #'+i.id+' × '+i.quantity+'</span><button onclick="remove('+i.id+')">Remove</button></div>').join(''):'Your cart is empty.';document.querySelector('#total').textContent='See total at checkout';}document.querySelector('#checkout').addEventListener('submit',async e=>{e.preventDefault();if(!cart.length){document.querySelector('#message').textContent='Add products first.';return}const f=new FormData(e.target),customer=Object.fromEntries(f.entries());const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer,items:cart})});const d=await r.json();document.querySelector('#message').textContent=r.ok?'Order #'+d.orderId+' placed. Total: $'+money(d.total):d.error;if(r.ok){cart=[];render();e.target.reset()}});load();</script></body></html>
